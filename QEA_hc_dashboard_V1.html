<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QEA Headcount Analytics</title>
<style>
/* system fonts - no external deps */
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f4f6fb;font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;min-height:100vh;padding:14px}
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:11px 15px;background:#fff;border-radius:10px;border:1px solid #e2e8f0;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.hdr-left{display:flex;align-items:center;gap:10px}
.hdr-icon{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#1e40af,#3b82f6);display:flex;align-items:center;justify-content:center}
.hdr-icon svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round}
.hdr-title{font-size:13.5px;font-weight:700;color:#0f172a;letter-spacing:-.2px}
.hdr-sub{font-size:9.5px;color:#94a3b8;font-family:'Courier New',Courier,monospace;margin-top:1px}
.pseg{display:flex;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:7px;overflow:hidden;flex-shrink:0}
.pseg button{font-size:9.5px;padding:4px 11px;border:none;cursor:pointer;background:transparent;color:#64748b;font-weight:600}
.pseg button.active{background:#1e40af;color:#fff;border-radius:5px;margin:2px}
.fbar{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:7px 13px;margin-bottom:10px;display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.frow{display:flex;align-items:center;gap:4px;flex-wrap:nowrap;overflow-x:auto}
.frow::-webkit-scrollbar{display:none}
.sep{width:1px;height:13px;background:#e2e8f0;margin:0 3px;flex-shrink:0}
.flbl{font-size:8.5px;font-weight:700;color:#94a3b8;letter-spacing:.1em;text-transform:uppercase;flex-shrink:0}
.pill{font-size:9px;padding:3px 9px;border:1px solid #e2e8f0;border-radius:6px;cursor:pointer;background:#f8fafc;color:#475569;font-weight:500;transition:all .1s;white-space:nowrap;flex-shrink:0}
.pill:hover{border-color:#93c5fd;color:#1e40af;background:#eff6ff}
.pill.on{color:#fff!important;border-color:transparent!important;box-shadow:0 1px 3px rgba(0,0,0,.15)}

.kpi-row{display:flex;gap:8px;margin-bottom:10px;align-items:stretch}
.kpi-divider{display:none}
.kpi{border-radius:10px;padding:7px 9px;position:relative;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08);flex:0 0 auto;width:fit-content;min-width:0}
.kpi-i{background:linear-gradient(135deg,#1e3a8a,#2563eb)}
.kpi-n{background:linear-gradient(135deg,#065f46,#059669)}
.kpi-g{background:linear-gradient(135deg,#92400e,#d97706)}
.kpi-q{background:linear-gradient(135deg,#4c1d95,#7c3aed)}
.kpi-glow{position:absolute;top:-18px;right:-18px;width:55px;height:55px;border-radius:50%;opacity:.2;filter:blur(16px)}
.kpi-l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.6);margin-bottom:2px;display:flex;justify-content:space-between;align-items:center}
.kpi-share{font-size:9px;font-weight:500;color:rgba(255,255,255,.4);letter-spacing:0;text-transform:none}
.kpi-v{font-size:20px;font-weight:700;color:#fff;font-family:'Courier New',Courier,monospace;letter-spacing:-.3px;line-height:1.1}
.kpi-rows{margin-top:4px;display:flex;flex-direction:column;gap:2px}
.kpi-row2{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.15);border-radius:4px;padding:2px 6px;width:100%}
.kpi-row2-lbl{font-size:9px;color:rgba(255,255,255,.5);font-weight:600;white-space:nowrap;flex:1}
.kpi-row2-val{font-size:10px;font-weight:700;font-family:'Courier New',Courier,monospace;white-space:nowrap}
.main{display:block}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:13px 15px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.card-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.card-title{font-size:11px;font-weight:700;color:#0f172a}
.card-sub{font-size:8.5px;color:#94a3b8;margin-top:1px;font-family:'Courier New',Courier,monospace}
.leg{display:flex;flex-wrap:wrap;gap:7px;font-size:8.5px;color:#64748b;align-items:center}
.ld{width:14px;height:2px;border-radius:2px;display:inline-block;margin-right:3px;vertical-align:middle}

/* table */
.tbl-wrap{background:#fff;border:1px solid #e2e8f0;border-radius:8px;margin-top:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.tbl-top{display:flex;align-items:center;justify-content:space-between;padding:4px 9px;background:#f8fafc;border-bottom:1px solid #e2e8f0}
.tbl-top span{font-size:7.5px;font-weight:700;color:#475569;letter-spacing:.06em;text-transform:uppercase}
.tbl-top em{font-size:7px;color:#94a3b8;font-style:normal;font-family:'Courier New',Courier,monospace}
.tbl-scroll{overflow-x:auto;max-height:200px;overflow-y:auto}
.tbl-scroll::-webkit-scrollbar{width:3px;height:3px}
.tbl-scroll::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:2px}
table{width:100%;border-collapse:collapse}
thead{position:sticky;top:0;z-index:3}
thead tr{background:#f1f5f9}
th{padding:5px 8px;font-size:11px;font-weight:700;color:#64748b;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;border-bottom:1px solid #e2e8f0;text-align:center;line-height:1.4}
th:first-child{text-align:left;position:sticky;left:0;background:#f1f5f9;z-index:4;min-width:56px}
th.chg{border-left:1px solid #e2e8f0}
tbody tr{border-bottom:1px solid #f1f5f9}
tbody tr:hover{background:#f8fafc}
tbody tr.tot{background:#eff6ff;border-top:1px solid #bfdbfe}
tbody tr.tot td{font-weight:700;color:#1e40af!important}
tbody tr.tot td:first-child{background:#eff6ff}
td{padding:4px 9px;text-align:center;font-family:'Courier New',Courier,monospace;font-size:11px;white-space:nowrap;color:#94a3b8;line-height:1.5}
td:first-child{text-align:left;font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-weight:600;font-size:11.5px;color:#334155;position:sticky;left:0;background:#fff;z-index:2;padding-left:8px}
td.up{color:#059669}td.dn{color:#dc2626}td.nu{color:#94a3b8}td.nm{color:#334155}
td.chg{border-left:1px solid #f1f5f9;font-weight:600;text-align:center}
/* inferences */
.inf{background:#f8fafc;border:1px solid #e2e8f0;border-left:3px solid #3b82f6;border-radius:0 8px 8px 0;padding:8px 11px;margin-top:8px}
.inf-ttl{font-size:7.5px;font-weight:700;color:#3b82f6;letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px}
.inf-item{font-size:8.5px;line-height:1.55;color:#334155;margin-bottom:4px}
.inf-item:last-child{margin-bottom:0}
.ib{display:inline-flex;align-items:center;justify-content:center;width:12px;height:12px;border-radius:3px;font-size:7px;font-weight:700;margin-right:3px;vertical-align:middle}
.iu{background:#dcfce7;color:#16a34a}.id2{background:#fee2e2;color:#dc2626}.inn{background:#f1f5f9;color:#64748b}.ih{background:#fef9c3;color:#ca8a04}
</style>
</head>

// ── NATIVE CHART ENGINE ───────────────────────────────────────────────────────
function drawLineChart(canvas, labels, datasets, minVal) {
  const dpr = window.devicePixelRatio||1;
  const W = canvas.offsetWidth||canvas.parentElement?.offsetWidth||800, H = canvas.offsetHeight||220;
  canvas.width = W*dpr; canvas.height = H*dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);

  const pad={top:28,right:16,bottom:42,left:52};
  const cw=W-pad.left-pad.right, ch=H-pad.top-pad.bottom;

  const allV=datasets.flatMap(d=>d.data).filter(v=>v>0);
  if(!allV.length){ctx.fillStyle='#94a3b8';ctx.font='12px Inter';ctx.textAlign='center';ctx.fillText('No data',W/2,H/2);return;}
  const maxV=Math.max(...allV);
  // for column charts, always baseline at 0 to show true proportions
  const minV=0;
  const rng=maxV||1;

  function yp(v){return pad.top+ch-(v-minV)/rng*ch;}

  const n=labels.length;
  const nDS=datasets.length;
  const groupW=cw/n;
  const barPad=groupW*0.15;
  const barW=Math.max(1,(groupW-barPad*2)/nDS);

  // horizontal grid lines
  ctx.strokeStyle='rgba(0,0,0,0.06)'; ctx.lineWidth=1;
  const ticks=5;
  for(let t=0;t<=ticks;t++){
    const v=maxV*t/ticks;
    const y=yp(v);
    ctx.beginPath();ctx.moveTo(pad.left,y);ctx.lineTo(pad.left+cw,y);ctx.stroke();
    ctx.fillStyle='#94a3b8';ctx.font=`9px 'JetBrains Mono',monospace`;ctx.textAlign='right';
    ctx.fillText(v>=1000?(v/1000).toFixed(0)+'k':v, pad.left-5, y+3);
  }

  // baseline
  ctx.strokeStyle='#e2e8f0'; ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(pad.left,pad.top+ch);ctx.lineTo(pad.left+cw,pad.top+ch);ctx.stroke();

  // x-axis labels
  const step=n>48?6:n>24?3:n>16?2:1;
  ctx.fillStyle='#94a3b8'; ctx.font="8.5px 'Inter',sans-serif"; ctx.textAlign='center';
  labels.forEach((lbl,i)=>{
    if(i===0||i===n-1||i%step===0){
      const gx=pad.left+i*groupW+groupW/2;
      ctx.fillText(lbl, gx, pad.top+ch+14);
    }
  });

  // draw columns
  datasets.forEach((ds,di)=>{
    ds.data.forEach((v,i)=>{
      if(!v) return;
      const gx=pad.left+i*groupW+barPad;
      const bx=gx+di*barW;
      const by=yp(v);
      const bh=pad.top+ch-by;
      if(bh<=0) return;

      // bar fill with slight gradient
      const grad=ctx.createLinearGradient(0,by,0,pad.top+ch);
      grad.addColorStop(0, ds.borderColor);
      grad.addColorStop(1, ds.borderColor+'99');
      ctx.fillStyle=grad;

      // rounded top corners
      const rx=Math.min(2, barW/2);
      ctx.beginPath();
      ctx.moveTo(bx+rx, by);
      ctx.lineTo(bx+barW-rx, by);
      ctx.quadraticCurveTo(bx+barW, by, bx+barW, by+rx);
      ctx.lineTo(bx+barW, pad.top+ch);
      ctx.lineTo(bx, pad.top+ch);
      ctx.lineTo(bx, by+rx);
      ctx.quadraticCurveTo(bx, by, bx+rx, by);
      ctx.closePath();
      ctx.fill();

      // data label above every bar — font scales with bar width
      const lv = v.toLocaleString();
      const fontSize = Math.max(6, Math.min(9, Math.floor(barW * 0.9)));
      if(barW >= 10){  // only show if bar is wide enough to read
        ctx.save();
        ctx.fillStyle = ds.borderColor;
        ctx.font = `bold ${fontSize}px 'Courier New',monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        // rotate for very narrow bars with multiple series
        if(barW < 14 && nDS > 1){
          ctx.save();
          ctx.translate(bx+barW/2, by-2);
          ctx.rotate(-Math.PI/2);
          ctx.fillText(lv, 0, 0);
          ctx.restore();
        } else {
          ctx.fillText(lv, bx+barW/2, by-2);
        }
        ctx.restore();
      }
    });
  });
}



// ── DATA HELPERS ──────────────────────────────────────────────────────────────
function src(){return st.period==='M'?D.M:D.Q;}
function gArr(geo,grade){const s=src();if(!geo||geo==='QEA')return s.QEA;return s[geo][grade||'Total'];}
function getYr(l){var m=l.match(/'(\d{2})$/);return m?m[1]:null;}

function idxs(){
  const L=src().L; let ii=L.map((_,i)=>i);
  if(st.year&&st.year.length){
    ii=ii.filter(function(i){const y=getYr(L[i]);return y&&st.year.includes(y);});
  }
  return ii.length>0?ii:[L.length-1]; // always return at least last period
}
function aGeos(){return st.geo&&st.geo.length?st.geo:['India','NA','GGM'];}

function mkDS(lbl,vals,col,dash,fill){return{label:lbl,data:vals,borderColor:col,dash:dash||[],fill:!!fill};}

function series(){
  const ii=idxs(), vis=ii.map(i=>src().L[i]), geos=aGeos(); let ds=[];
  if(!st.grade){
    if(!st.geo){
      ds.push(mkDS('QEA',ii.map(i=>src().QEA[i]),GC.QEA,[],true));
      GEOS.forEach(g=>ds.push(mkDS(g,ii.map(i=>gArr(g,null)[i]),GC[g],g==='NA'?[6,3]:g==='GGM'?[2,3]:[])));
    } else if(geos.length===1){
      ds.push(mkDS(geos[0],ii.map(i=>gArr(geos[0],null)[i]),GC[geos[0]],[],true));
    } else {
      geos.forEach(g=>ds.push(mkDS(g,ii.map(i=>gArr(g,null)[i]),GC[g],[])));
    }
  } else {
    st.grade.forEach(gr=>{geos.forEach(geo=>{
      const arr=gArr(geo,gr); if(!arr)return;
      const lbl=geos.length>1?`${geo} ${gr}`:gr;
      ds.push(mkDS(lbl,ii.map(i=>arr[i]),geos.length>1?GC[geo]:RC[gr],[]));
    });});
  }
  return{vis,ds,ii};
}

function renderTrend(){
  const {vis,ds,ii}=series();
  const allV=ds.flatMap(d=>d.data).filter(v=>v>0);
  const minV=allV.length?Math.floor(Math.min(...allV)*0.93/1000)*1000:0;
  const c=document.getElementById('mc');
  c.style.width='100%'; c.style.height='220px';
  drawLineChart(c,vis,ds,minV);
  // legend
  document.getElementById('legRow').innerHTML=ds.map(d=>`<span style="display:flex;align-items:center;gap:2px"><span class="ld" style="background:${d.borderColor}"></span><span style="font-size:8.5px">${d.label}</span></span>`).join('');
}

function renderKPIs(ii){
  const li=ii[ii.length-1], pi=ii.length>1?ii[ii.length-2]:li, fi=ii[0];
  const s=src();
  const currLbl=s.L[li], prevLbl=s.L[pi], startLbl=s.L[fi];

  function card(geo, cfg, cur, pv, first, qeaTotal) {
    const share=qeaTotal>0?(cur/qeaTotal*100).toFixed(1):'--';
    const momDiff=cur-pv, momUp=momDiff>=0, momPct=pv>0?((momDiff/pv)*100).toFixed(1):0;
    const periodDiff=cur-first, periodUp=periodDiff>=0, periodPct=first>0?((periodDiff/first)*100).toFixed(1):0;
    const momCol=momUp?'#86efac':'#fca5a5';
    const periodCol=periodUp?'#86efac':'#fca5a5';
    const isSame=fi===li;
    return '<div class="kpi '+cfg.cls+'">'
      +'<div class="kpi-glow" style="background:'+cfg.glow+'"></div>'
      +'<div class="kpi-l">'+geo+'<span class="kpi-share">'+share+'% of QEA</span></div>'
      +'<div class="kpi-v">'+cur.toLocaleString()+'</div>'
      +'<div class="kpi-rows">'
        +'<div class="kpi-row2">'
          +'<span class="kpi-row2-lbl">'+prevLbl+' vs '+currLbl+'</span>'
          +'<span class="kpi-row2-val" style="color:'+momCol+'">'+(momUp?'▲':'▼')+' '+Math.abs(momDiff).toLocaleString()+' ('+(momUp?'+':'')+momPct+'%)</span>'
        +'</div>'
        +(!isSame?'<div class="kpi-row2">'
          +'<span class="kpi-row2-lbl">'+startLbl+' vs '+currLbl+'</span>'
          +'<span class="kpi-row2-val" style="color:'+periodCol+'">'+(periodUp?'▲':'▼')+' '+Math.abs(periodDiff).toLocaleString()+' ('+(periodUp?'+':'')+periodPct+'%)</span>'
        +'</div>':'')
      +'</div>'
    +'</div>';
  }

  const allGeos=['India','NA','GGM'];
  const qeaCur=s.QEA[li];
  const geoItems=allGeos.map(function(geo){
    const cfg=KCI[geo], arr=gArr(geo,null);
    return card(geo, cfg, arr[li], arr[pi], arr[fi], qeaCur);
  });

  const qeaCfg=KCI['QEA'];
  const allQEA=ii.map(function(i){return s.QEA[i];});
  const peakQEA=Math.max.apply(null,allQEA);
  const peakLblK=s.L[ii[allQEA.indexOf(peakQEA)]];
  const momDiff=qeaCur-s.QEA[pi], momUp=momDiff>=0, momPct=s.QEA[pi]>0?((momDiff/s.QEA[pi])*100).toFixed(1):0;
  const periodDiff=qeaCur-s.QEA[fi], periodUp=periodDiff>=0, periodPct=s.QEA[fi]>0?((periodDiff/s.QEA[fi])*100).toFixed(1):0;
  const isSame=fi===li;
  const qeaCard='<div class="kpi '+qeaCfg.cls+'" style="border:2px solid rgba(255,255,255,.15)">'
    +'<div class="kpi-glow" style="background:'+qeaCfg.glow+'"></div>'
    +'<div class="kpi-l">QEA TOTAL<span class="kpi-share">'+(peakQEA===qeaCur?'★ Peak':'★ '+peakLblK)+'</span></div>'
    +'<div class="kpi-v">'+qeaCur.toLocaleString()+'</div>'
    +'<div class="kpi-rows">'
      +'<div class="kpi-row2">'
        +'<span class="kpi-row2-lbl">'+prevLbl+' vs '+currLbl+'</span>'
        +'<span class="kpi-row2-val" style="color:'+(momUp?'#86efac':'#fca5a5')+'">'+(momUp?'▲':'▼')+' '+Math.abs(momDiff).toLocaleString()+' ('+(momUp?'+':'')+momPct+'%)</span>'
      +'</div>'
      +(isSame?'':'<div class="kpi-row2">'
        +'<span class="kpi-row2-lbl">'+startLbl+' vs '+currLbl+'</span>'
        +'<span class="kpi-row2-val" style="color:'+(periodUp?'#86efac':'#fca5a5')+'">'+(periodUp?'▲':'▼')+' '+Math.abs(periodDiff).toLocaleString()+' ('+(periodUp?'+':'')+periodPct+'%)</span>'
      +'</div>')
    +'</div>'
  +'</div>';

  document.getElementById('kpiRow').innerHTML=geoItems.join('')+'<div class="kpi-divider"></div>'+qeaCard;
}

  let rows=[];
  if(st.grade&&st.grade.length){
    rows=st.grade.map(g=>({lbl:g,col:RC[g],data:ii.map(i=>geos.reduce((sum,geo)=>sum+(s[geo][g]?s[geo][g][i]:0),0)),tot:false}));
  } else {
    rows=geos.map(geo=>({lbl:geo,col:GC[geo],data:ii.map(i=>gArr(geo,null)[i]),tot:false}));
    rows.push({lbl:'QEA',col:GC.QEA,data:ii.map(i=>s.QEA[i]),tot:true});
  }
  const maxCols=14, step=vis.length>maxCols?Math.ceil(vis.length/maxCols):1;
  const show=vis.map((_,i)=>i%step===0||i===vis.length-1);
  const prevLbl=vis.length>1?vis[vis.length-2]:'Prev';
  const currLbl=vis[vis.length-1];
  const startLbl=vis[0];
  document.getElementById('tblHead').innerHTML=`<tr><th>Row</th>${vis.map((v,i)=>show[i]?`<th>${v}</th>`:'').join('')}<th class="chg">${prevLbl} vs ${currLbl}</th><th class="chg">Change %</th><th class="chg">${startLbl} vs ${currLbl}</th><th class="chg">Period Chg %</th></tr>`;
  document.getElementById('tblBody').innerHTML=rows.map(r=>{
    const v=r.data, last=v[v.length-1]||0, prev=v.length>1?v[v.length-2]||0:last;
    const first=v[0]||0;
    const d=last-prev, pct=prev>0?((d/prev)*100).toFixed(1):0, cc=d>0?'up':d<0?'dn':'nu';
    const dPeriod=last-first, pctPeriod=first>0?((dPeriod/first)*100).toFixed(1):0, ccP=dPeriod>0?'up':dPeriod<0?'dn':'nu';
    const cells=v.map((val,vi)=>{if(!show[vi])return'';const pv=vi>0?v[vi-1]:val,dv=val-pv;return`<td class="${vi===0?'nm':dv>0?'up':dv<0?'dn':'nm'}">${val.toLocaleString()}</td>`;}).join('');
    const dot=`<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${r.col};margin-right:3px;vertical-align:middle"></span>`;
    return `<tr class="${r.tot?'tot':''}"><td>${dot}${r.lbl}</td>${cells}<td class="chg ${cc}">${d>=0?'+':''}${d.toLocaleString()}</td><td class="chg ${cc}">${d>=0?'+':''}${pct}%</td><td class="chg ${ccP}">${dPeriod>=0?'+':''}${dPeriod.toLocaleString()}</td><td class="chg ${ccP}">${dPeriod>=0?'+':''}${pctPeriod}%</td></tr>`;
  }).join('');
  document.getElementById('tblMeta').textContent=`${vis.length} periods · ${rows.length} rows`;
}



function renderInferences(ii){
  const s=src(), geos=aGeos();
  const li=ii[ii.length-1], fi=ii[0], pi=ii.length>1?ii[ii.length-2]:li;
  function getT(i){return geos.reduce((s,g)=>s+(gArr(g,null)[i]||0),0);}
  const cur=getT(li), prev=getT(pi), first=getT(fi);
  const allV=ii.map(i=>getT(i)), pk=Math.max(...allV), pkI=ii[allV.indexOf(pk)];
  const uB='<span class="ib iu">↑</span>',dB='<span class="ib id2">↓</span>',nB='<span class="ib inn">→</span>',hB='<span class="ib ih">★</span>';
  const items=[];
  const d1=cur-prev;
  items.push(`${d1>=0?uB:dB}Latest (${s.L[li]}): <b>${cur.toLocaleString()}</b> — ${d1>=0?'up':'down'} ${Math.abs(d1).toLocaleString()} (${d1>=0?'+':''}${prev>0?((d1/prev)*100).toFixed(1):0}%) vs ${s.L[pi]}.`);
  if(ii.length>1){const d2=cur-first;items.push(`${d2>=0?uB:dB}Range ${s.L[fi]}→${s.L[li]}: ${d2>=0?'grew':'fell'} by ${Math.abs(d2).toLocaleString()} (${d2>=0?'+':''}${first>0?((d2/first)*100).toFixed(1):0}%).`);}
  if(pkI!==li&&ii.length>2) items.push(`${hB}Peak: <b>${pk.toLocaleString()}</b> at ${s.L[pkI]} — currently ${(pk-cur).toLocaleString()} below peak.`);
  if(geos.length===3&&!st.geo){const gv=GEOS.map(g=>gArr(g,null)[li]);const gt2=gv.reduce((a,b)=>a+b,0);const tg=GEOS[gv.indexOf(Math.max(...gv))];items.push(`${nB}${tg} = ${(Math.max(...gv)/gt2*100).toFixed(1)}% of QEA at ${s.L[li]}.`);}
  if(!st.grade){const gv2=GRADES.map(g=>geos.reduce((sum,geo)=>{const a=s[geo][g];return sum+(a?a[li]:0);},0));const gt2=gv2.reduce((a,b)=>a+b,0);const ti=gv2.indexOf(Math.max(...gv2));items.push(`${nB}<b>${GRADES[ti]}</b> is largest grade at ${(gv2[ti]/gt2*100).toFixed(1)}%.`);}
  document.getElementById('infList').innerHTML=items.map(t=>`<div class="inf-item">${t}</div>`).join('');
}

function updateTitles(){
  const gl=st.geo?st.geo.join('+'):'All Geo', grl=st.grade?st.grade.join(', '):'All Grades';
  const yl=st.year?st.year.map(y=>'20'+y).join(', '):'All Years';
  document.getElementById('ctitle').textContent=`QEA Total Headcount — ${gl}`;
  document.getElementById('csub').textContent=`${grl.toUpperCase()} · ${yl.toUpperCase()} · ${st.period==='M'?'MONTHLY':'QUARTERLY'}`;
}

function render(){
  const ii=idxs(), li=ii[ii.length-1];
  renderTrend();
  renderKPIs(ii);
  renderTable(ii);
  renderInferences(ii);
  updateTitles();
}

// ── FILTER CONTROLS ───────────────────────────────────────────────────────────
function apill(attr,val,col){
  const b=document.querySelector(`[${attr}="${val}"]`); if(!b)return;
  b.classList.add('on');
  b.style.background=col||'#1e40af'; b.style.color='#fff'; b.style.borderColor='transparent';
}
function dpill(attr){document.querySelectorAll(`[${attr}]`).forEach(b=>{b.classList.remove('on');b.style.cssText=''});}
function atog(arr,v){const i=arr.indexOf(v);if(i>-1){arr.splice(i,1);return false;}arr.push(v);return true;}
const aMap={geo:'data-geo',grade:'data-g',year:'data-y'};
const cMap={geo:GC,grade:RC};

function tog(type,val,btn){
  const attr=aMap[type], allB=document.querySelector(`[${attr}="All"]`);
  if(val==='All'){st[type]=null;dpill(attr);apill(attr,'All');}
  else{
    if(type==='year'){}
    allB.classList.remove('on');allB.style.cssText='';
    if(!st[type])st[type]=[];
    const col=cMap[type]?cMap[type][val]:null;
    if(atog(st[type],val)){apill(attr,val,col);}else{btn.classList.remove('on');btn.style.cssText='';}
    if(!st[type].length){st[type]=null;dpill(attr);apill(attr,'All');}
  }
  render();
}
function setPeriod(p,btn){
  st.period=p;
  document.querySelectorAll('#pSeg button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}


// ── INIT ──────────────────────────────────────────────────────────────────────
function init(){
  apill('data-geo','All'); apill('data-y','All'); apill('data-g','All');
  render();
  window.addEventListener('resize',()=>render());
}
document.addEventListener('DOMContentLoaded', function(){ requestAnimationFrame(function(){ requestAnimationFrame(init); }); });
</script>
